name: "ciparity"
description: "Report drift between your pre-commit hooks and your CI pipeline (GitHub Actions or GitLab CI)."
branding:
  icon: "git-pull-request"
  color: "blue"
inputs:
  path:
    description: "Repository path to inspect"
    required: false
    default: "."
  args:
    description: "Extra CLI arguments (e.g. --json, --ignore pytest, --exit-zero)"
    required: false
    default: ""
  version:
    description: "ciparity version to run (empty installs the latest release)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    - name: Run ciparity
      shell: bash
      run: |
        SPEC="ciparity"
        if [ -n "${{ inputs.version }}" ]; then
          SPEC="ciparity==${{ inputs.version }}"
        fi
        uvx --from "$SPEC" ciparity "${{ inputs.path }}" ${{ inputs.args }}
