name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ruff==0.6.2 mypy==1.10.0 pytest
      - run: ruff check .
      - run: mypy --strict src
      - run: pytest -q
      - run: vulture src
