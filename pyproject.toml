[project]
name = "ciparity"
version = "0.3.1"
description = "Find drift between your pre-commit hooks and your CI pipeline (GitHub Actions, GitLab CI)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Topicspot" }]
keywords = ["pre-commit", "github-actions", "ci", "lint", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/Topicspot/ciparity"
Repository = "https://github.com/Topicspot/ciparity"
Issues = "https://github.com/Topicspot/ciparity/issues"
Changelog = "https://github.com/Topicspot/ciparity/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "ruff==0.16.0",
  "mypy==2.3.0",
  "types-PyYAML",
  "vulture>=2.16",
  "pip-audit>=2.7",
  "pillow>=11",
]

[project.scripts]
ciparity = "ciparity.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ciparity"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "scripts"]

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
